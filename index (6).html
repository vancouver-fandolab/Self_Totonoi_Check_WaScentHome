<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Self Totonoi Check</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F7F2EA; --indigo:#1E3A5F; --gold:#C9A46A; --text:#2B2B2B;
    --white:#FFFFFF; --line:#E8DFD0;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;}
  html{scroll-padding-top:env(safe-area-inset-top,0px);}
  html,body{height:100%;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:"Noto Sans JP","Hiragino Kaku Gothic ProN",sans-serif;
    display:flex; align-items:center; justify-content:center;
    min-height:100%; padding:24px 16px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){ --bg:#1B1B18; --white:#242420; --text:#EDE7DA; --line:#3A362E; }
  }
  :root[data-theme="dark"]{ --bg:#1B1B18; --white:#242420; --text:#EDE7DA; --line:#3A362E; }

  .app{ width:100%; max-width:420px; }

  .lang-switch{ display:flex; justify-content:center; gap:14px; margin-bottom:18px; }
  .lang-btn{
    background:none; border:none; font-size:12px; color:var(--text); opacity:0.45;
    cursor:pointer; font-family:"Noto Sans JP",sans-serif; padding:4px 2px;
    border-bottom:1px solid transparent;
  }
  .lang-btn.active{ opacity:1; color:var(--indigo); border-bottom:1px solid var(--gold); font-weight:500; }

  .brand{ text-align:center; color:var(--gold); font-size:12px; letter-spacing:4px; margin-bottom:6px; font-weight:500; }
  h1.title{
    font-family:"Shippori Mincho",serif; text-align:center; color:var(--indigo);
    font-size:25px; font-weight:700; margin:0 0 4px 0; letter-spacing:1px;
  }
  .subtitle{ text-align:center; font-size:12.5px; color:var(--text); opacity:0.6; margin-bottom:26px; }

  .ring-wrap{ display:flex; justify-content:center; margin-bottom:26px; }
  .ring{
    width:74px; height:74px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    background:conic-gradient(var(--gold) calc(var(--p,0)*1%), var(--line) 0); transition:background 0.6s ease;
  }
  .ring-inner{ width:58px; height:58px; border-radius:50%; background:var(--bg); display:flex; align-items:center; justify-content:center; font-size:13px; color:var(--indigo); font-weight:500; }

  .card{ background:var(--white); border:1px solid var(--line); border-radius:4px; padding:34px 26px; min-height:300px; display:flex; flex-direction:column; justify-content:space-between; }

  .q-cat{ font-size:12px; color:var(--gold); letter-spacing:2px; margin-bottom:10px; }
  .q-text{ font-family:"Shippori Mincho",serif; font-size:18px; line-height:1.7; color:var(--indigo); margin:0 0 28px 0; }

  .scale{ display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:10px; }
  .dot-btn{ background:none; border:none; cursor:pointer; padding:6px; display:flex; flex-direction:column; align-items:center; gap:8px; }
  .dot{ border-radius:50%; border:1.5px solid var(--gold); background:transparent; transition:all 0.25s ease; }
  .dot-btn[data-v="1"] .dot{ width:16px; height:16px; }
  .dot-btn[data-v="2"] .dot{ width:20px; height:20px; }
  .dot-btn[data-v="3"] .dot{ width:24px; height:24px; }
  .dot-btn[data-v="4"] .dot{ width:28px; height:28px; }
  .dot-btn[data-v="5"] .dot{ width:32px; height:32px; }
  .dot-btn.selected .dot{ background:var(--gold); }

  .scale-caption{ display:flex; justify-content:space-between; font-size:10.5px; color:var(--text); opacity:0.5; margin-bottom:18px; gap:8px; }
  .scale-caption span{ max-width:45%; }

  .next-btn{
    width:100%; padding:14px; border:none; border-radius:2px; background:var(--indigo); color:var(--white);
    font-size:14px; font-family:"Noto Sans JP",sans-serif; letter-spacing:1px; cursor:pointer;
    opacity:0; transform:translateY(6px); transition:opacity 0.3s ease, transform 0.3s ease, background 0.2s ease;
    pointer-events:none;
  }
  .next-btn.ready{ opacity:1; transform:translateY(0); pointer-events:auto; }
  .next-btn:hover.ready{ background:#16314f; }
  .next-btn:focus-visible{ outline:2px solid var(--gold); outline-offset:2px; }
  .dot-btn:focus-visible .dot{ outline:2px solid var(--indigo); outline-offset:3px; }

  .result{ text-align:center; animation:fadein 0.5s ease; }
  @keyframes fadein{ from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);} }
  .result-eyebrow{ font-size:12px; color:var(--gold); letter-spacing:2px; margin-bottom:14px; }
  .result-title{ font-family:"Shippori Mincho",serif; font-size:20px; color:var(--indigo); margin:0 0 18px 0; line-height:1.6; }
  .result-text{ font-size:14px; line-height:1.95; white-space:pre-line; margin-bottom:24px; }
  .result-action{ background:var(--bg); border:1px solid var(--line); border-radius:4px; padding:14px 16px; font-size:12.5px; color:var(--indigo); margin-bottom:24px; }
  .restart-btn{ background:none; border:1px solid var(--gold); color:var(--indigo); padding:12px 20px; border-radius:2px; font-size:13px; cursor:pointer; font-family:"Noto Sans JP",sans-serif; }
  .restart-btn:hover{ background:var(--gold); color:var(--white); }

  .score-section{ text-align:left; margin-bottom:22px; padding-top:18px; border-top:1px solid var(--line); }
  .score-heading{ font-size:11.5px; color:var(--gold); letter-spacing:1.5px; margin-bottom:14px; text-align:center; }
  .score-total{ text-align:center; margin-bottom:18px; }
  .score-total .num{ font-family:"Shippori Mincho",serif; font-size:34px; color:var(--indigo); line-height:1; }
  .score-total .num span{ font-size:16px; opacity:0.5; font-family:"Noto Sans JP",sans-serif; }
  .score-total .label{ font-size:11px; color:var(--text); opacity:0.55; margin-top:4px; }
  .score-row{ display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; gap:10px; }
  .score-row .score-cat{ font-size:12px; color:var(--text); opacity:0.75; flex:1; text-align:left; }
  .score-right{ display:flex; align-items:center; gap:8px; flex-shrink:0; }
  .score-dots{ display:flex; gap:4px; }
  .score-dot{ width:9px; height:9px; border-radius:50%; border:1px solid var(--gold); background:transparent; }
  .score-dot.filled{ background:var(--gold); }
  .score-num{ font-size:11px; color:var(--indigo); font-weight:500; min-width:24px; text-align:right; }

  .share-row{ display:flex; justify-content:center; gap:10px; margin-bottom:16px; flex-wrap:wrap; }
  .share-btn{
    display:flex; align-items:center; gap:6px; background:var(--indigo); color:var(--white);
    border:none; padding:11px 16px; border-radius:2px; font-size:12.5px; cursor:pointer;
    font-family:"Noto Sans JP",sans-serif;
  }
  .share-btn:hover{ background:#16314f; }
  .share-btn.line{ background:#06C755; }
  .share-btn.line:hover{ background:#05a847; }
  .share-btn svg{ width:14px; height:14px; flex-shrink:0; }

  .toast{
    position:fixed; left:50%; bottom:28px; transform:translateX(-50%) translateY(10px);
    background:var(--indigo); color:var(--white); padding:10px 18px; border-radius:3px;
    font-size:12.5px; opacity:0; transition:opacity 0.25s ease, transform 0.25s ease;
    pointer-events:none; z-index:10; white-space:nowrap;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  @media (prefers-reduced-motion: reduce){ *{ animation:none !important; transition:none !important; } }
</style>
</head>

function renderLangSwitch(){
  langSwitchEl.innerHTML = Object.keys(LANG_NAMES).map(code =>
    `<button class="lang-btn${code===lang?" active":""}" onclick="setLang('${code}')">${LANG_NAMES[code]}</button>`
  ).join("");
}

function setLang(code){
  lang = code;
  try { localStorage.setItem("totonoi_lang", lang); } catch(e) {}
  renderLangSwitch();
  subtitleEl.textContent = I18N[lang].subtitle;
  if (step < QUESTION_KEYS.length) renderQuestion(); else showResult();
}

function renderQuestion(){
  selected = null;
  const t = I18N[lang];
  const q = t.questions[step];
  ring.style.setProperty("--p", Math.round((step/QUESTION_KEYS.length)*100));
  ringLabel.textContent = (step+1) + " / " + QUESTION_KEYS.length;

  let dots = "";
  for(let i=1;i<=5;i++){
    dots += `<button class="dot-btn" data-v="${i}" aria-label="${t.scaleLabels[i-1]}" onclick="selectScore(${i})"><span class="dot"></span></button>`;
  }

  card.innerHTML = `
    <div>
      <div class="q-cat">${q.cat}</div>
      <p class="q-text">${q.text}</p>
      <div class="scale">${dots}</div>
      <div class="scale-caption"><span>${t.scaleLabels[0]}</span><span>${t.scaleLabels[4]}</span></div>
    </div>
    <button class="next-btn" id="nextBtn" onclick="nextStep()">${t.next}</button>
  `;
}

function selectScore(v){
  selected = v;
  document.querySelectorAll(".dot-btn").forEach(btn=>{
    btn.classList.toggle("selected", parseInt(btn.dataset.v) <= v);
  });
  document.getElementById("nextBtn").classList.add("ready");
}

function nextStep(){
  if(selected === null) return;
  scores[QUESTION_KEYS[step]] = selected;
  step++;
  if(step < QUESTION_KEYS.length){
    renderQuestion();
  } else {
    ring.style.setProperty("--p", 100);
    ringLabel.textContent = I18N[lang].done;
    showResult();
  }
}

function pickKey(){
  if(scores.medical <= 2) return "medical";
  if(scores.rest <= 2) return "rest";
  if(scores.food <= 2 && scores.detox <= 2) return "foodDetox";
  if(scores.food <= 2) return "food";
  if(Object.values(scores).every(v => v >= 3)) return "allHigh";
  return "default";
}

function showResult(){
  const p = I18N[lang].presc[pickKey()];
  card.innerHTML = `
    <div class="result">
      <div class="result-eyebrow">${p.eyebrow}</div>
      <h2 class="result-title">${p.title.replace(/\n/g,"<br>")}</h2>
      <div class="result-text">${p.text}</div>
      ${p.action ? `<div class="result-action">${p.action}</div>` : ""}
      <div class="score-section">
        <div class="score-total">
          <div class="num">${totalScore()}<span> / 30</span></div>
          <div class="label">${I18N[lang].totalLabel}</div>
        </div>
        <div class="score-heading">${I18N[lang].scoreHeading}</div>
        ${renderScoreRows()}
      </div>
      <div class="share-row">
        <button class="share-btn" onclick="shareResult()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
          ${I18N[lang].share}
        </button>
        <button class="share-btn line" onclick="shareToLine()">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 5.94 2 10.7c0 4.27 3.58 7.85 8.42 8.56.33.07.77.22.88.5.1.26.07.66.03.92l-.14.86c-.04.26-.2 1 .88.55 1.08-.46 5.8-3.42 7.92-5.85C21.44 13.98 22 12.4 22 10.7 22 5.94 17.52 2 12 2z"/></svg>
          ${I18N[lang].shareLine}
        </button>
      </div>
      <button class="restart-btn" onclick="restart()">${I18N[lang].restart}</button>
    </div>
    <div class="toast" id="toast"></div>
  `;
}

function totalScore(){
  return QUESTION_KEYS.reduce((sum, key) => sum + (scores[key] || 0), 0);
}

function renderScoreRows(){
  const t = I18N[lang];
  return QUESTION_KEYS.map((key, i) => {
    const v = scores[key] || 0;
    const catName = t.questions[i].cat;
    let dots = "";
    for(let d=1; d<=5; d++){
      dots += `<span class="score-dot${d<=v?" filled":""}"></span>`;
    }
    return `<div class="score-row"><span class="score-cat">${catName}</span><span class="score-right"><span class="score-dots">${dots}</span><span class="score-num">${v}/5</span></span></div>`;
  }).join("");
}

function buildShareText(){
  const t = I18N[lang];
  const p = t.presc[pickKey()];
  const plainTitle = p.title.replace(/\n/g," ");
  const plainText = p.text.replace(/\n/g," ");
  let msg = `🌿 ${t.shareIntro}\n\n${plainTitle}\n\n${plainText}`;
  if(p.action) msg += `\n\n${p.action}`;
  msg += `\n\n${t.totalLabel}: ${totalScore()} / 30`;
  msg += `\n\n${t.scoreHeading}:\n`;
  msg += QUESTION_KEYS.map((key, i) => `${t.questions[i].cat} ${scores[key] || 0}/5`).join("\n");
  msg += `\n\n— WaScentHome · Self Totonoi Check`;
  return msg;
}

async function shareResult(){
  const text = buildShareText();
  if(navigator.share){
    try{
      await navigator.share({ text: text });
      return;
    }catch(e){ /* user cancelled or unsupported — fall through to copy */ }
  }
  try{
    await navigator.clipboard.writeText(text);
    showToast(I18N[lang].copied);
  }catch(e){
    showToast(I18N[lang].copied);
  }
}

function shareToLine(){
  const text = buildShareText();
  const url = "https://social-plugins.line.me/lineit/share?text=" + encodeURIComponent(text);
  window.open(url, "_blank", "noopener,noreferrer");
}

function showToast(msg){
  const t = document.getElementById("toast");
  if(!t) return;
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(()=>{ t.classList.remove("show"); }, 2200);
}

function restart(){ step = 0; scores = {}; if(step < QUESTION_KEYS.length) renderQuestion(); }

renderLangSwitch();
subtitleEl.textContent = I18N[lang].subtitle;
renderQuestion();
</script>
</body>
</html>
